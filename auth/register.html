<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | SIS</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><div class="brand-mark">S</div><strong>Student Information System</strong></div>
    <h1>Create your account</h1>
    <p>Sign up as a student or a teacher.</p>
    <form class="auth-form" id="registerForm" novalidate>
      <label>Full name
        <input type="text" id="fullName" placeholder="Your full name">
        <span class="field-error" id="fullNameError"></span>
      </label>
      <label>Email
        <input type="email" id="email" placeholder="you@sisstudent.edu or you@sisteacher.edu">
        <span class="field-error" id="emailError"></span>
      </label>
      <label>Password
        <input type="password" id="password" placeholder="At least 8 characters">
        <button type="button" class="password-toggle" id="registerPasswordToggle" aria-pressed="false">Show password</button>
        <span class="field-error" id="passwordError"></span>
      </label>
      <label>Confirm password
        <input type="password" id="confirmPassword" placeholder="Repeat your password">
        <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-pressed="false">Show password</button>
        <span class="field-error" id="confirmPasswordError"></span>
      </label>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <div class="auth-links">
      <span class="muted">Already have an account?</span>
      <a href="login.html">Log in</a>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
