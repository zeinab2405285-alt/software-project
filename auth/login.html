<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SIS</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><div class="brand-mark">S</div><strong>Student Information System</strong></div>
    <h1>Welcome back</h1>
    <p>Log in to access your dashboard.</p>
    <form class="auth-form" id="loginForm" novalidate>
      <label>Email
        <input type="email" id="email" placeholder="you@sisstudent.edu or admin@sis.edu" autocomplete="off">
        <span class="field-error" id="emailError"></span>
      </label>
      <label>Password
        <input type="password" id="password" placeholder="Enter your password" autocomplete="off">
        <button type="button" class="password-toggle" id="passwordToggle" aria-pressed="false">Show password</button>
        <span class="field-error" id="passwordError"></span>
      </label>
      <div class="field-error" id="formError"></div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <div class="auth-links">
      <a href="register.html">Create account</a>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
