<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | SIS</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><div class="brand-mark">S</div><strong>Student Information System</strong></div>
    <h1>Forgot your password?</h1>
    <p>Enter your email and we will send you a link to reset it.</p>
    <div class="notice" id="successNotice" hidden>
      If an account exists for this email, a reset link has been sent.<br><br>
      <strong>Demo:</strong> <a href="reset-password.html">Open the reset page</a>
    </div>
    <form class="auth-form" id="forgotForm" novalidate>
      <label>Email
        <input type="email" id="email" placeholder="you@university.edu">
        <span class="field-error" id="emailError"></span>
      </label>
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>
    <div class="auth-links">
      <a href="login.html">Back to login</a>
      <a href="register.html">Create account</a>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
