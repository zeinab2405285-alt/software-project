
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | SIS</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand"><div class="brand-mark">S</div><strong>Student Information System</strong></div>
    <h1>Set a new password</h1>
    <p>Choose a new password for your account.</p>
    <form class="auth-form" id="resetForm" novalidate>
      <label>New password
        <input type="password" id="password" placeholder="At least 8 characters">
        <span class="field-error" id="passwordError"></span>
      </label>
      <label>Confirm new password
        <input type="password" id="confirmPassword" placeholder="Repeat your new password">
        <span class="field-error" id="confirmPasswordError"></span>
      </label>
      <button type="submit" class="btn btn-primary">Reset password</button>
    </form>
    <div class="auth-links">
      <a href="login.html">Back to login</a>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/main.js"></script>
</body>
</html>
